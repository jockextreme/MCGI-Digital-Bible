<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCGI Digital Bible — Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Presenter view has no toolbar — the card fills the whole window. */
  .stage-shell{ padding:1.6vw; }
  .conn-badge{
    position:fixed; top:16px; right:20px; z-index:10;
    font-size:11px; font-weight:600;
    color:#dce6ff; background:rgba(4,8,20,0.55); backdrop-filter:blur(6px);
    padding:6px 14px; border-radius:999px; opacity:0.85;
    border:1px solid rgba(224,168,60,0.3);
    transition:opacity .18s cubic-bezier(.4,0,.2,1);
  }
  .conn-badge.connected{ opacity:0; pointer-events:none; }
  .version-mode{
    position:fixed; bottom:16px; left:20px; z-index:10;
  }
  .version-mode select{
    background:rgba(4,8,20,0.55); backdrop-filter:blur(6px); color:#dce6ff;
    border:1px solid rgba(224,168,60,0.35);
    border-radius:999px; padding:6px 14px; font-size:11px; font-weight:600;
    opacity:0.7; cursor:pointer;
    transition:opacity .18s cubic-bezier(.4,0,.2,1);
  }
  .version-mode select:hover, .version-mode select:focus{ opacity:1; }
</style>
</head>
<body>

  <div class="conn-badge" id="connBadge">Connecting…</div>
  <div class="version-mode">
    <select id="versionModeSelect" title="Choose which version to display"></select>
  </div>

  <div class="stage-shell">
    <div class="card" id="card">
      <div class="logo-badge" aria-hidden="true">MCGI</div>
      <div class="card-inner">
        <p class="ref" id="stageRef">—</p>
        <p class="version-label" id="stageVersion">Waiting for a reference…</p>
        <div class="verse-body">
          <p id="stageText">Open the control panel on another window/device and pick a verse.</p>
        </div>
        <div class="crossrefs" id="crossrefs"></div>
      </div>
    </div>
  </div>

  <script src="js/present.js"></script>
</body>
</html>
