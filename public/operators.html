<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose an Operator — MCGI Digital Bible</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .picker-shell{
    max-width:560px; margin:0 auto; padding:60px 20px;
    font-family:Arial, Helvetica, sans-serif; color:#fff;
  }
  .picker-shell h1{ font-size:26px; margin:0 0 8px; }
  .picker-shell p.sub{ color:#cbd5f5; font-size:14px; margin:0 0 28px; }
  .op-list{ display:flex; flex-direction:column; gap:10px; }
  .op-item{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); border:1px solid rgba(224,168,60,0.35);
    border-radius:8px; padding:14px 16px; cursor:pointer; text-decoration:none; color:#fff;
  }
  .op-item:hover{ background:rgba(255,255,255,0.12); }
  .op-item .name{ font-weight:700; font-size:15px; }
  .op-item .go{ color:var(--gold-soft); font-size:13px; }
  .empty-state{
    color:#cbd5f5; font-size:14px; background:rgba(255,255,255,0.05);
    border-radius:8px; padding:20px; text-align:center;
  }
  .refresh-note{ margin-top:18px; font-size:12px; color:#8fa0d6; }
</style>
</head>
<body>
  <div class="picker-shell">
    <h1>Choose an Operator</h1>
    <p class="sub">Pick who you want to follow — you'll see whatever verse they're currently showing.</p>
    <div class="op-list" id="opList">
      <div class="empty-state">Loading…</div>
    </div>
    <div class="refresh-note">This list refreshes automatically every few seconds.</div>
  </div>

  <script>
    async function loadOperators() {
      const listEl = document.getElementById('opList');
      try {
        const res = await fetch('/api/operators/online');
        const operators = await res.json();
        if (!operators.length) {
          listEl.innerHTML = '<div class="empty-state">No operators are online right now.</div>';
          return;
        }
        listEl.innerHTML = operators.map(op => `
          <a class="op-item" href="/present?operator=${encodeURIComponent(op.username)}">
            <span class="name">${escapeHtml(op.displayName)}</span>
            <span class="go">Follow →</span>
          </a>
        `).join('');
      } catch (err) {
        listEl.innerHTML = '<div class="empty-state">Could not load operators — is the server running?</div>';
      }
    }
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    loadOperators();
    setInterval(loadOperators, 5000);
  </script>
</body>
</html>
