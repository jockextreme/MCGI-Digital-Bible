<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suggestions — Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{ background:#0a1330; align-items:initial; justify-content:initial; display:block; }
  .wrap{ max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  h1{ color:#fff; font-size:22px; margin:0 0 6px; }
  .hint{ color:#a9b6e0; font-size:13px; margin:0 0 20px; }
  .key-row{ display:flex; gap:8px; margin-bottom:24px; }
  .key-row input{
    flex:1; height:44px; padding:0 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.04); color:#fff; font-size:14px;
  }
  .key-row button{
    height:44px; padding:0 18px; border-radius:10px; border:none; font-weight:700; cursor:pointer;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#241a00;
  }
  .item{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; padding:16px 18px; margin-bottom:12px;
  }
  .item .meta{ font-size:11.5px; color:#8b98c4; margin-bottom:8px; }
  .item .msg{ font-size:14.5px; color:#e7ebfa; line-height:1.6; white-space:pre-wrap; }
  .empty, .error{ color:#a9b6e0; font-size:14px; text-align:center; padding:40px 0; }
  .error{ color:#ff9b9b; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Submitted suggestions</h1>
    <p class="hint">Not linked from anywhere in the app. Set <code>ADMIN_KEY</code> in your server environment, then enter it below.</p>
    <div class="key-row">
      <input type="password" id="keyInput" placeholder="ADMIN_KEY" autocomplete="off" />
      <button id="loadBtn">Load</button>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const keyInput = document.getElementById('keyInput');
    const list = document.getElementById('list');
    const saved = localStorage.getItem('mcgi-admin-key');
    if (saved) keyInput.value = saved;

    async function load() {
      const key = keyInput.value.trim();
      localStorage.setItem('mcgi-admin-key', key);
      list.innerHTML = '<p class="hint">Loading…</p>';
      try {
        const res = await fetch('/api/suggestions?key=' + encodeURIComponent(key));
        if (!res.ok) {
          list.innerHTML = '<p class="error">Not authorized — check the key.</p>';
          return;
        }
        const rows = await res.json();
        if (!rows.length) {
          list.innerHTML = '<p class="empty">No suggestions yet.</p>';
          return;
        }
        list.innerHTML = rows.map(r => `
          <div class="item">
            <div class="meta">${r.createdAt} ${r.name ? '· ' + escapeHtml(r.name) : ''}</div>
            <div class="msg">${escapeHtml(r.message)}</div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = '<p class="error">Could not reach the server.</p>';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    document.getElementById('loadBtn').addEventListener('click', load);
    keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
    if (saved) load();
  </script>
</body>
</html>
